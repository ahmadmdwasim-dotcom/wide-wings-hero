<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wide Wings Media — Give your brand WINGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Nexa / Calibri are the brand fonts. Montserrat + Carlito are metric-close
     web fallbacks so this prototype renders right without the licensed files. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Carlito:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* =====================================================================
     WIDE WINGS MEDIA — hero section
     Brand rules: Nexa/Calibri (with fallbacks), brand palette, dark hero,
     white body elsewhere, no emojis, no icon packs.
     The brand logo mark drops in, then soars — a slow bob, a soft wing
     "flap", and a light sweep that traces its silhouette. Services run
     in an infinite marquee below.
     ===================================================================== */

  :root {
    --indigo:        #2e2e62;
    --indigo-deep:   #0d0d2b;
    --magenta:       #a73184;
    --magenta-bright:#b62d83;
    --gold:          #cfa821;
    --gold-bright:   #dcb920;
    --amber:         #e48900;
    --orange:        #c55b03;
    --blue:          #52628a;
    --blue-light:    #6ba0ba;
    --ink:           #ffffff;
    --muted:         rgba(255,255,255,0.70);
    --line:          rgba(255,255,255,0.14);

    --head: "Nexa", "Montserrat", "Arial Black", system-ui, sans-serif;
    --body: "Calibri", "Carlito", system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--indigo-deep); }
  body {
    font-family: var(--body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img { max-width: 100%; }

  /* ---------------- shell ---------------- */
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(66% 52% at 50% 32%, rgba(167,49,132,0.26) 0%, rgba(167,49,132,0) 60%),
      radial-gradient(55% 60% at 10% 92%, rgba(207,168,33,0.15) 0%, rgba(207,168,33,0) 55%),
      radial-gradient(55% 60% at 92% 84%, rgba(82,98,138,0.22) 0%, rgba(82,98,138,0) 55%),
      linear-gradient(160deg, var(--indigo) 0%, var(--indigo-deep) 66%);
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 96px;
    mask-image: radial-gradient(66% 54% at 50% 40%, #000 0%, transparent 74%);
    opacity: 0.13;
  }

  /* faint logo shards scattered across the backdrop, each drifting a little */
  .hero-debris {
    position: absolute; inset: 0; z-index: 1;
    overflow: hidden; pointer-events: none;
  }
  .debris {
    position: absolute;
    filter: blur(1.4px);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    animation: drift var(--dur, 12s) ease-in-out var(--delay, 0s) infinite alternate;
    will-change: transform;
  }
  @keyframes drift {
    from { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); }
    to   { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px)))
                      rotate(calc(var(--rot, 0deg) + var(--spin, 10deg))); }
  }

  /* ---------------- nav ---------------- */
  .nav {
    position: relative; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: clamp(16px, 3vw, 28px) clamp(20px, 5vw, 60px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand__mark { width: clamp(38px, 5vw, 50px); height: auto; flex: none; display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35)); }
  .brand__text {
    font-family: var(--head); font-weight: 800; white-space: nowrap;
    font-size: clamp(14px, 1.7vw, 17px); letter-spacing: 0.14em;
    line-height: 1; color: #fff; text-transform: uppercase;
  }
  .brand__text b { font-weight: 900; }
  .brand__text small {
    display: block; margin-top: 5px; white-space: nowrap;
    font-family: var(--body); font-weight: 400;
    font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  @media (max-width: 420px) { .brand__text small { display: none; } }
  .nav-links { display: flex; align-items: center; gap: clamp(14px, 2vw, 28px); }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-family: var(--head); font-weight: 700;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    transition: color 0.25s var(--ease);
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta {
    font-family: var(--head); font-weight: 800;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 11px 20px; border-radius: 999px;
    background: linear-gradient(100deg, var(--magenta-bright), var(--orange) 60%, var(--gold));
    color: #fff; text-decoration: none;
    box-shadow: 0 12px 30px -12px rgba(182,45,131,0.6);
  }
  .nav-toggle { display: none; }

  /* ---------------- centre content ---------------- */
  .hero__inner {
    position: relative; z-index: 5; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: clamp(14px, 3vh, 30px) clamp(20px, 5vw, 40px) clamp(18px, 4vh, 40px);
  }

  /* the animated logo mark */
  .logo-stage {
    position: relative;
    width: min(300px, 54vw);
    aspect-ratio: 790 / 573;
    margin-bottom: clamp(16px, 3.5vh, 34px);
  }
  .logo-soar {
    position: absolute; inset: 0;
  }
  .logo-flap {
    position: absolute; inset: 0;
    filter:
      drop-shadow(0 24px 44px rgba(0,0,0,0.45))
      drop-shadow(0 0 26px rgba(228,137,0,0.34))
      drop-shadow(0 0 46px rgba(167,49,132,0.26))
      drop-shadow(0 0 70px rgba(82,98,138,0.20));
  }

  /* the mark, cut into wedge shards that fly straight in and lock still */
  .logo-stack { position: absolute; inset: 0; }
  .logo-piece {
    position: absolute; display: block;
    --fly: 70vmin;
    opacity: 0;
    transform: translate(calc(var(--dx) * var(--fly)), calc(var(--dy) * var(--fly))) scale(0.34);
    animation: fly 1.4s cubic-bezier(0.5, 0.02, 0.16, 1) var(--delay, 0s) forwards;
  }
  @keyframes fly {
    0%   { opacity: 0; filter: blur(5px);
           transform: translate(calc(var(--dx) * var(--fly)), calc(var(--dy) * var(--fly))) scale(0.34); }
    18%  { opacity: 1; }
    60%  { filter: blur(0); }
    100% { opacity: 1; filter: blur(0); transform: translate(0, 0) scale(1); }
  }
  /* soft coloured bloom right behind the mark */
  .logo-stage::before {
    content: ""; position: absolute; inset: -46% -34%;
    z-index: -1;
    background: radial-gradient(closest-side,
      rgba(228,137,0,0.34), rgba(167,49,132,0.22) 42%,
      rgba(82,98,138,0.14) 62%, transparent 78%);
    filter: blur(24px);
    opacity: 0;
    animation: bloom 1.6s ease-out 1.9s forwards, bloomPulse 5.5s ease-in-out 3.6s infinite;
  }
  @keyframes bloom { to { opacity: 1; } }
  @keyframes bloomPulse { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--head); font-weight: 700;
    font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold-bright);
  }
  .eyebrow::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold-bright); box-shadow: 0 0 12px var(--gold-bright);
  }

  h1 {
    font-family: var(--head); font-weight: 900;
    line-height: 1.03; letter-spacing: 0.005em;
    font-size: clamp(2.3rem, 6.4vw, 4.6rem);
    margin: 24px 0 0;
    text-transform: uppercase;
  }
  /* keep each word unbroken while its letters are individually wrapped */
  h1 .hw { display: inline-block; white-space: nowrap; }
  h1 .wings { position: relative; }
  /* per-character magnifier */
  h1 .ch {
    display: inline-block;
    transform-origin: 50% 60%;
    transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.2, 1);
    will-change: transform;
  }
  h1 .ch--wings {
    background: linear-gradient(100deg,
      #b62d83 0%, #e48900 25%, #dcb920 50%, #e48900 75%, #b62d83 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: wingsFlow 5s linear infinite;
  }
  @keyframes wingsFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: -200% 50%; }
  }
  /* the little butterfly that rides the word */
  .bfly {
    position: absolute;
    top: -0.78em; right: -0.5em;
    width: 0.72em; height: 0.72em;
    pointer-events: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35));
    animation: flit 4.2s ease-in-out 2.6s infinite both;
    opacity: 0;
  }
  .bfly svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .bfly .wl, .bfly .wr { transform-box: fill-box; }
  .bfly .wl { transform-origin: 100% 50%; animation: flap 0.4s ease-in-out 2.6s infinite; }
  .bfly .wr { transform-origin: 0% 50%;   animation: flap 0.4s ease-in-out 2.6s infinite; }
  @keyframes flit {
    0%   { opacity: 0; transform: translate(1px, 7px) rotate(-8deg) scale(0.7); }
    20%  { opacity: 1; }
    50%  { opacity: 1; transform: translate(9px, -9px) rotate(12deg) scale(1); }
    100% { opacity: 1; transform: translate(1px, 7px) rotate(-8deg) scale(1); }
  }
  @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.34); } }

  .sub {
    max-width: 52ch; margin: 20px auto 0;
    color: var(--muted); font-size: 1.1rem; line-height: 1.75;
  }

  .cta-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 30px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--head); font-weight: 800;
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; padding: 17px 30px; border-radius: 999px;
    cursor: pointer; border: 1px solid transparent;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
  }
  .btn--primary {
    color: #fff;
    background: linear-gradient(100deg, var(--magenta-bright), var(--orange) 55%, var(--gold));
    box-shadow: 0 14px 40px -12px rgba(182,45,131,0.6);
  }
  .btn--primary:hover { transform: translateY(-2px); box-shadow: 0 20px 46px -12px rgba(182,45,131,0.78); }
  .btn--primary svg { transition: transform 0.25s var(--ease); }
  .btn--primary:hover svg { transform: translateX(4px); }
  .btn--ghost { color: #fff; border-color: var(--line); }
  .btn--ghost:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.4); }

  /* ---------------- services scroll ---------------- */
  .ticker {
    position: relative; z-index: 5;
    display: flex; align-items: stretch;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: linear-gradient(to top, rgba(13,13,43,0.75), rgba(13,13,43,0.2));
    overflow: hidden;
  }
  /* fixed label, pinned to the left */
  .ticker__label {
    flex: none;
    display: flex; align-items: center;
    padding: 18px clamp(18px, 3vw, 32px);
    border-right: 1px solid var(--line);
    background: var(--indigo-deep);
    font-family: var(--head); font-weight: 800;
    font-size: clamp(9.5px, 1vw, 11px); letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold-bright);
    white-space: nowrap; z-index: 2;
  }
  /* scrolling viewport, fills the rest */
  .ticker__viewport {
    flex: 1; min-width: 0;
    display: flex; align-items: center;
    overflow: hidden;
    -webkit-mask: linear-gradient(90deg, #000 82%, transparent);
            mask: linear-gradient(90deg, #000 82%, transparent);
  }
  .ticker__track { display: flex; width: max-content; animation: marquee 42s linear infinite; }
  .ticker__viewport:hover .ticker__track { animation-play-state: paused; }
  .ticker__group { display: flex; flex-shrink: 0; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  .service {
    display: inline-flex; align-items: center; gap: 16px; padding: 0 26px;
    font-family: var(--head); font-weight: 800;
    font-size: clamp(1rem, 1.6vw, 1.32rem);
    white-space: nowrap; color: rgba(255,255,255,0.88);
  }
  .service svg { flex: none; }
  .service:nth-child(3n)   { color: var(--gold-bright); }
  .service:nth-child(3n+2) { color: #d98ac1; }

  /* ---------------- entrance ---------------- */
  .reveal { opacity: 0; transform: translateY(22px); animation: reveal 0.9s var(--ease) both; }
  .nav.reveal { animation-delay: 0.1s; }
  .d1 { animation-delay: 2.5s; }
  .d2 { animation-delay: 2.65s; }
  .d3 { animation-delay: 2.8s; }
  .d4 { animation-delay: 2.95s; }
  .d5 { animation-delay: 3.15s; }
  @keyframes reveal { to { opacity: 1; transform: none; } }

  @media (max-width: 900px) {
    .nav-links, .nav-cta { display: none; }
    .nav-toggle {
      display: block; width: 40px; height: 40px;
      border: 1px solid var(--line); border-radius: 10px; background: none;
    }
    .nav-toggle i, .nav-toggle::before, .nav-toggle::after {
      content: ""; display: block; width: 18px; height: 2px; margin: 3px auto; background: #fff;
    }
    .logo-stage { width: min(280px, 68vw); }
    .logo-piece { --fly: 78vmin; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-soar, .logo-flap, .logo-piece, .logo-stage::before, .debris,
    .reveal, .ticker__track, .bfly, .bfly .wl, .bfly .wr, .ch--wings {
      animation: none !important;
    }
    .logo-piece, .reveal, .bfly { opacity: 1 !important; transform: none !important; filter: none !important; }
    .logo-stage::before { opacity: 1 !important; }
  }
</style>
</head>
<body>
<header class="hero">

  <nav class="nav reveal">
    <a class="brand" href="#" aria-label="Wide Wings Media home">
      <img class="brand__mark" src="logo-mark.png" alt="" />
      <span class="brand__text">WIDE <b>WINGS</b><small>Media &amp; Advertisement</small></span>
    </a>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About Us</a>
      <a href="#">Work</a>
      <a href="#">Contact</a>
    </div>
    <a class="nav-cta" href="#">Free Consultation</a>
    <button class="nav-toggle" aria-label="Menu"><i></i></button>
  </nav>

  <div class="hero__inner">

    <div class="logo-stage" aria-hidden="true">
      <div class="logo-soar">
        <div class="logo-flap">
          <div class="logo-stack" id="stack"></div>
        </div>
      </div>
    </div>

    <span class="eyebrow reveal d1">Media &amp; Advertisement</span>
    <h1 class="reveal d2" id="headline"><span class="hw">Give</span> <span class="hw">your</span> <span class="hw">brand</span> <span class="hw wings">WINGS<span class="bfly" aria-hidden="true">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bwing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b62d83"/><stop offset="1" stop-color="#e48900"/>
          </linearGradient>
        </defs>
        <g stroke="#dcb920" stroke-width="1.1" fill="none" stroke-linecap="round">
          <path d="M15.4 9 C 13.5 5.5, 12 4.6, 10.6 4.2"/>
          <path d="M16.6 9 C 18.5 5.5, 20 4.6, 21.4 4.2"/>
        </g>
        <g class="wl">
          <path d="M16 13 C 12 5, 1 6, 3 14 C 4 19, 12 19, 16 15 Z" fill="url(#bwing)"/>
          <path d="M16 16 C 12 18, 6 20, 7 26 C 8 30, 15 25, 16 19 Z" fill="#dcb920"/>
        </g>
        <g class="wr">
          <path d="M16 13 C 20 5, 31 6, 29 14 C 28 19, 20 19, 16 15 Z" fill="url(#bwing)"/>
          <path d="M16 16 C 20 18, 26 20, 25 26 C 24 30, 17 25, 16 19 Z" fill="#dcb920"/>
        </g>
        <path d="M16 8 C 15 12, 15 20, 16 25 C 17 20, 17 12, 16 8 Z" fill="#2e2e62"/>
      </svg>
    </span></span></h1>
    <p class="sub reveal d3">
      Strategy, creative and media under one roof. We build brands that fly &mdash;
      and keep them airborne with work that performs.
    </p>
    <div class="cta-row reveal d4">
      <a class="btn btn--primary" href="#">
        Free Consultation
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <path d="M1 6h13M9 1l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="btn btn--ghost" href="#">Explore Services</a>
    </div>
  </div>

  <div class="ticker reveal d5" aria-label="Our services">
    <span class="ticker__label">What we do</span>
    <div class="ticker__viewport">
      <div class="ticker__track" id="track">
        <div class="ticker__group" id="svcGroup"></div>
        <div class="ticker__group" aria-hidden="true" id="svcGroup2"></div>
      </div>
    </div>
  </div>

</header>

<script>
(function () {
  "use strict";

  /* ---- logo shards: each flies in from its own direction and locks together ---- */
  // left / top / width / height are % of the mark box; dx/dy is the unit vector
  // pointing from the logo's centre out through that shard (its fly-in heading).
  var PIECES = [
    { f: "piece-0.png", left: 49.873, top: 25.131, width: 7.215,  dx:  0.210, dy: -0.978 },
    { f: "piece-1.png", left: 49.873, top: 2.792,  width: 48.734, dx:  0.854, dy: -0.520 },
    { f: "piece-2.png", left: 50.000, top: 37.347, width: 37.595, dx:  0.999, dy: -0.048 },
    { f: "piece-3.png", left: 49.873, top: 54.101, width: 27.975, dx:  0.797, dy:  0.604 },
    { f: "piece-4.png", left: 49.873, top: 54.276, width: 19.747, dx:  0.365, dy:  0.931 },
    { f: "piece-5.png", left: 30.886, top: 54.101, width: 19.494, dx: -0.360, dy:  0.933 },
    { f: "piece-6.png", left: 22.911, top: 54.101, width: 27.342, dx: -0.796, dy:  0.605 },
    { f: "piece-7.png", left: 13.038, top: 37.522, width: 37.215, dx: -0.999, dy: -0.050 },
    { f: "piece-8.png", left: 1.519,  top: 2.094,  width: 48.861, dx: -0.847, dy: -0.532 },
    { f: "piece-9.png", left: 43.671, top: 25.829, width: 6.709,  dx: -0.201, dy: -0.980 }
  ];
  // scatter the entrance order so it doesn't sweep predictably around the ring
  var ORDER = [1, 8, 4, 5, 2, 7, 0, 9, 3, 6];
  var stack = document.getElementById("stack");
  if (stack) {
    PIECES.forEach(function (p, i) {
      var img = new Image();
      img.className = "logo-piece";
      img.src = p.f;
      img.alt = "";
      img.style.left = p.left + "%";
      img.style.top = p.top + "%";
      img.style.width = p.width + "%";
      img.style.setProperty("--dx", p.dx);
      img.style.setProperty("--dy", p.dy);
      img.style.setProperty("--delay", (0.1 + ORDER.indexOf(i) * 0.1).toFixed(2) + "s");
      stack.appendChild(img);
    });
  }

  /* ---- scatter faint shards across the whole hero backdrop ---- */
  var hero = document.querySelector(".hero");
  if (hero) {
    var debris = document.createElement("div");
    debris.className = "hero-debris";
    debris.setAttribute("aria-hidden", "true");
    hero.insertBefore(debris, hero.firstChild);

    var rnd = function (a, b) { return a + Math.random() * (b - a); };
    var SLOTS = 15;
    for (var d = 0; d < SLOTS; d++) {
      var frag = PIECES[d % PIECES.length].f;   // reuse the already-loaded shard data
      var chip = new Image();
      chip.className = "debris";
      chip.src = frag;
      chip.alt = "";
      chip.style.width = rnd(38, 120).toFixed(0) + "px";
      chip.style.left = rnd(2, 98).toFixed(2) + "%";
      chip.style.top = rnd(2, 98).toFixed(2) + "%";
      chip.style.opacity = rnd(0.05, 0.13).toFixed(3);
      var dur = rnd(9, 20);
      chip.style.setProperty("--dur", dur.toFixed(1) + "s");
      chip.style.setProperty("--delay", (-rnd(0, dur)).toFixed(1) + "s");
      chip.style.setProperty("--rot", rnd(-40, 40).toFixed(0) + "deg");
      chip.style.setProperty("--spin", rnd(-14, 14).toFixed(0) + "deg");
      chip.style.setProperty("--dx", rnd(-26, 26).toFixed(0) + "px");
      chip.style.setProperty("--dy", rnd(-26, 26).toFixed(0) + "px");
      debris.appendChild(chip);
    }
  }

  /* ---- headline: wrap every letter, then magnify the ones near the cursor ---- */
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var headline = document.getElementById("headline");
  if (headline) {
    headline.querySelectorAll(".hw").forEach(function (word) {
      var isWings = word.classList.contains("wings");
      Array.prototype.slice.call(word.childNodes).forEach(function (node) {
        if (node.nodeType !== 3) return;              // keep element children (butterfly)
        var frag = document.createDocumentFragment();
        node.textContent.split("").forEach(function (chr) {
          var s = document.createElement("span");
          s.className = "ch" + (isWings ? " ch--wings" : "");
          s.textContent = chr;
          frag.appendChild(s);
        });
        word.replaceChild(frag, node);
      });
    });

    if (!reduceMotion) {
      var chars = Array.prototype.slice.call(headline.querySelectorAll(".ch"));
      var centres = [];
      var RADIUS = 135, AMP = 0.55, LIFT = 7;

      function measure() {
        chars.forEach(function (c) { c.style.transform = ""; });
        centres = chars.map(function (c) {
          var r = c.getBoundingClientRect();
          return { c: c, x: r.left + r.width / 2, y: r.top + r.height / 2 };
        });
      }
      function onMove(e) {
        for (var i = 0; i < centres.length; i++) {
          var p = centres[i];
          var dx = e.clientX - p.x, dy = e.clientY - p.y;
          var t = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / RADIUS);
          t = t * t;                                   // sharper falloff
          p.c.style.transform = t
            ? "translateY(" + (-LIFT * t) + "px) scale(" + (1 + AMP * t) + ")"
            : "";
        }
      }
      function reset() { chars.forEach(function (c) { c.style.transform = ""; }); }

      headline.addEventListener("pointerenter", measure);
      headline.addEventListener("pointermove", onMove);
      headline.addEventListener("pointerleave", reset);
      window.addEventListener("resize", reset);
    }
  }

  var SERVICES = [
    "Web & App Development",
    "Creative & Branding",
    "Paid Advertising & Media Buying",
    "Social Media Management",
    "Content Creation & Graphic Design",
    "Email, SMS & CRM Marketing",
    "SEO & Performance Management",
    "OOH Advertising",
    "Analytics & Performance Marketing",
    "PR Management"
  ];
  var GLYPH = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#dcb920"/></svg>';

  function fill(el) {
    el.innerHTML = SERVICES.map(function (name) {
      return '<span class="service">' + GLYPH + name + '</span>';
    }).join("");
  }
  fill(document.getElementById("svcGroup"));
  fill(document.getElementById("svcGroup2"));
})();
</script>
